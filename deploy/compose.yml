# Nexora Shop's compose stack. The install writes .env beside this file with
# the answers to the manifest's options (NEXORA_OPT_*), the panel's address
# and the claim code; `docker compose up -d` starts it.
services:
  shop:
    image: ghcr.io/nexora-vpn/shop:${NEXORA_ADDON_VERSION:-latest}
    container_name: nexora-shop
    restart: unless-stopped
    env_file: .env
    ports:
      - "${NEXORA_OPT_PORT:-8095}:${NEXORA_OPT_PORT:-8095}"
      # Shop's own HTTPS (https=acme or self-signed): install.sh publishes
      # the public address's port to it (443:8443 for acme), and otherwise
      # a loopback port nothing uses.
      - "${NEXORA_HTTPS_PUBLISH:-127.0.0.1::8443}"
    volumes:
      - ./data:/data
